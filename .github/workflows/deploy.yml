name: Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Node.js for CDK
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CDK dependencies
        run: |
          cd ecs
          npm ci

      - name: Preserve MCP configuration
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          SERVICE_ARN=$(aws cloudformation describe-stack-resource --stack-name DocTranslationStack --logical-resource-id BackendService7A4224EE --query 'StackResourceDetail.PhysicalResourceId' --output text)
          TASK_ARN=$(aws ecs describe-services --cluster doc-translation-cluster --services "$SERVICE_ARN" --query 'services[0].taskDefinition' --output text)
          ENVIRONMENT=$(aws ecs describe-task-definition --task-definition "$TASK_ARN" --query 'taskDefinition.containerDefinitions[].environment[]' --output json)
          HOSTS=$(jq -r '[.[] | select(.name == "MCP_ALLOWED_HOSTS") | .value] | first // empty' <<< "$ENVIRONMENT")
          ORIGINS=$(jq -r '[.[] | select(.name == "MCP_ALLOWED_ORIGINS") | .value] | first // empty' <<< "$ENVIRONMENT")
          CURRENT_JWT=$(jq -r '[.[] | select(.name == "JWT_SECRET") | .value] | first // empty' <<< "$ENVIRONMENT")
          if [[ -z "$HOSTS" || -z "$ORIGINS" || -z "$CURRENT_JWT" || "$CURRENT_JWT" != "$JWT_SECRET" || "$HOSTS" == *$'\n'* || "$ORIGINS" == *$'\n'* ]]; then
            echo 'Current MCP configuration or JWT secret does not match; deployment stopped.' >&2
            exit 1
          fi
          printf 'MCP_ALLOWED_HOSTS=%s\nMCP_ALLOWED_ORIGINS=%s\n' "$HOSTS" "$ORIGINS" >> "$GITHUB_ENV"

      - name: CDK Deploy
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CPU_ARCH: x64
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          DEPLOY_REGION: ${{ vars.AWS_REGION }}
          ENABLE_INTERNAL_ALB: 'true'
          VPC_CIDR: ${{ vars.VPC_CIDR }}
          INTERNAL_ALB_SOURCE_CIDR: ${{ vars.INTERNAL_ALB_SOURCE_CIDR }}
        run: |
          cd ecs
          npx cdk deploy -c "region=$DEPLOY_REGION" --require-approval never

  notify-result:
    needs: deploy
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send deployment result
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [[ "$DEPLOY_RESULT" == success ]]; then
            TITLE='✅ 部署成功'
          else
            TITLE='❌ 部署失败或未完成'
          fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          PAYLOAD=$(jq -n --arg title "$TITLE" --arg sha "${GITHUB_SHA:0:7}" --arg url "$RUN_URL" '{msgtype:"markdown",markdown:{content:("## " + $title + "\n\n**项目**: sgp-doc-translation\n**Commit**: `" + $sha + "`\n\n> [查看部署详情](" + $url + ")")}}')
          RESPONSE=$(curl --silent --show-error --fail --max-time 20 -H 'Content-Type: application/json' -d "$PAYLOAD" "$WECHAT_WEBHOOK_URL")
          if ! jq -e '.errcode == 0' >/dev/null <<< "$RESPONSE"; then
            echo 'WeCom rejected the deployment notification.' >&2
            exit 1
          fi
          echo 'WeCom accepted the deployment notification.'
