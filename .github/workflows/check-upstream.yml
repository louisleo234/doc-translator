name: Check Upstream Updates

on:
  schedule:
    # 02:00 UTC+8 = 18:00 UTC
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        env:
          UPSTREAM_READ_TOKEN: ${{ secrets.UPSTREAM_READ_TOKEN }}
        run: |
          if [[ -z "$UPSTREAM_READ_TOKEN" ]]; then
            echo 'Missing read-only credential for the private upstream repository.' >&2
            exit 1
          fi
          git remote add upstream https://github.com/freewine/doc-translator.git
          UPSTREAM_AUTH=$(printf 'x-access-token:%s' "$UPSTREAM_READ_TOKEN" | base64 | tr -d '\n')
          GIT_CONFIG_COUNT=2 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0= \
          GIT_CONFIG_KEY_1=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $UPSTREAM_AUTH" \
          git fetch upstream main

      - name: Check for new commits
        id: check
        run: |
          NEW_COMMITS=$(git log main..upstream/main --oneline)
          if [ -n "$NEW_COMMITS" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            NEW_COMMITS_ESCAPED="${NEW_COMMITS//$'\n'/'\\n'}"
            echo "new_commits=$NEW_COMMITS_ESCAPED" >> $GITHUB_OUTPUT
            echo "Found new commits:"
            echo "$NEW_COMMITS"
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "No new commits from upstream"
          fi

      - name: Prepare sync branch
        if: steps.check.outputs.has_updates == 'true'
        id: prepare
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="sync/upstream-$(date +%Y%m%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"

          # Attempt merge, capture result without aborting on failure
          if git merge upstream/main --no-edit; then
            echo "merge_ok=true" >> $GITHUB_OUTPUT
          else
            # Commit conflict markers so branch can be pushed for manual review
            git add -A
            git commit -m "chore: upstream sync $(date +%Y-%m-%d) - CONFLICTS need manual resolution"
            echo "merge_ok=false" >> $GITHUB_OUTPUT
          fi

      - name: Push branch & create PR (merge conflict)
        if: steps.check.outputs.has_updates == 'true' && steps.prepare.outputs.merge_ok == 'false'
        env:
          NEW_COMMITS: ${{ steps.check.outputs.new_commits }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin "$BRANCH"

          BODY=$(jq -n \
            --arg commits "$NEW_COMMITS" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{
              title: "chore: sync upstream \(now | strftime("%Y-%m-%d")) [MERGE CONFLICT]",
              body: ("## ⚠️ 上游更新 - 合并冲突，需人工处理\n\n### New Commits\n```\n" + $commits + "\n```\n\n> 自动合并失败，冲突标记已提交到此分支。\n> checkout 此分支后手动解决冲突，再合并到 main。\n> [查看 Actions 日志](" + $run_url + ")"),
              head: (env.BRANCH),
              base: "main"
            }')

          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls" \
            -d "$BODY"

      - name: Notify WeChat - merge conflict
        if: steps.check.outputs.has_updates == 'true' && steps.prepare.outputs.merge_ok == 'false'
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          NEW_COMMITS: ${{ steps.check.outputs.new_commits }}
        run: |
          PAYLOAD=$(jq -n --arg commits "$NEW_COMMITS" --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pulls" '{msgtype:"markdown",markdown:{content:("## ⚠️ 上游更新 - 合并冲突\n\n**项目**: sgp-doc-translation\n\n**新 Commits**:\n```\n" + $commits + "\n```\n\n> 自动合并失败，请人工解决冲突。\n> [查看 PR](" + $url + ")")}}')
          RESPONSE=$(curl --silent --show-error --fail --max-time 20 -H 'Content-Type: application/json' -d "$PAYLOAD" "$WECHAT_WEBHOOK_URL")
          jq -e '.errcode == 0' >/dev/null <<< "$RESPONSE"

      - name: Set up Python & run tests
        if: steps.check.outputs.has_updates == 'true' && steps.prepare.outputs.merge_ok == 'true'
        id: tests
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_ENDPOINT_URL: http://127.0.0.1:1
        run: |
          pip install uv -q
          cd backend
          uv sync --extra dev -q
          # Disable pipefail so pytest exit code is captured even when tests fail
          set +e
          uv run pytest tests/ -q --tb=short 2>&1 | tee test_output.txt
          TEST_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$TEST_EXIT" >> $GITHUB_OUTPUT

      - name: Auto-merge to main (tests passed)
        if: steps.check.outputs.has_updates == 'true' && steps.prepare.outputs.merge_ok == 'true' && steps.tests.outputs.exit_code == '0'
        run: |
          git checkout main
          git merge $BRANCH --no-edit
          git push origin main

      - name: Trigger Deploy workflow
        # GITHUB_TOKEN push does NOT auto-trigger other workflows; dispatch explicitly
        if: steps.check.outputs.has_updates == 'true' && steps.prepare.outputs.merge_ok == 'true' && steps.tests.outputs.exit_code == '0'
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: Notify WeChat - deploy triggered
        if: steps.check.outputs.has_updates == 'true' && steps.prepare.outputs.merge_ok == 'true' && steps.tests.outputs.exit_code == '0'
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          NEW_COMMITS: ${{ steps.check.outputs.new_commits }}
        run: |
          PAYLOAD=$(jq -n --arg commits "$NEW_COMMITS" '{msgtype:"markdown",markdown:{content:("## ✅ 上游更新已同步并触发部署\n\n**项目**: sgp-doc-translation\n\n**新 Commits**:\n```\n" + $commits + "\n```\n\n> 单测通过，已自动合并并触发部署流水线。")}}')
          RESPONSE=$(curl --silent --show-error --fail --max-time 20 -H 'Content-Type: application/json' -d "$PAYLOAD" "$WECHAT_WEBHOOK_URL")
          jq -e '.errcode == 0' >/dev/null <<< "$RESPONSE"

      - name: Push branch & create PR (tests failed)
        if: steps.check.outputs.has_updates == 'true' && steps.prepare.outputs.merge_ok == 'true' && steps.tests.outputs.exit_code != '0'
        env:
          NEW_COMMITS: ${{ steps.check.outputs.new_commits }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin "$BRANCH"

          BODY=$(jq -n \
            --arg commits "$NEW_COMMITS" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{
              title: "chore: sync upstream \(now | strftime("%Y-%m-%d")) [TEST FAILED]",
              body: ("## ⚠️ 上游更新 - 单测失败，需人工处理\n\n### New Commits\n```\n" + $commits + "\n```\n\n### 测试失败摘要\n请查看 [Actions 日志](" + $run_url + ")"),
              head: (env.BRANCH),
              base: "main"
            }')

          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls" \
            -d "$BODY"

      - name: Notify WeChat - test failed needs review
        if: steps.check.outputs.has_updates == 'true' && steps.prepare.outputs.merge_ok == 'true' && steps.tests.outputs.exit_code != '0'
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          NEW_COMMITS: ${{ steps.check.outputs.new_commits }}
        run: |
          PAYLOAD=$(jq -n --arg commits "$NEW_COMMITS" --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pulls" '{msgtype:"markdown",markdown:{content:("## ⚠️ 上游有更新但单测失败\n\n**项目**: sgp-doc-translation\n\n**新 Commits**:\n```\n" + $commits + "\n```\n\n> 已自动建 PR，请人工检查后合并。\n> [查看 PR](" + $url + ")")}}')
          RESPONSE=$(curl --silent --show-error --fail --max-time 20 -H 'Content-Type: application/json' -d "$PAYLOAD" "$WECHAT_WEBHOOK_URL")
          jq -e '.errcode == 0' >/dev/null <<< "$RESPONSE"

  notify-failure:
    needs: check-upstream
    if: ${{ always() && needs.check-upstream.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send upstream failure notification
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          PAYLOAD=$(jq -n --arg url "$RUN_URL" '{msgtype:"markdown",markdown:{content:("## ❌ 上游检查失败\n\n**项目**: sgp-doc-translation\n\n> [查看流水线详情](" + $url + ")")}}')
          RESPONSE=$(curl --silent --show-error --fail --max-time 20 -H 'Content-Type: application/json' -d "$PAYLOAD" "$WECHAT_WEBHOOK_URL")
          if ! jq -e '.errcode == 0' >/dev/null <<< "$RESPONSE"; then
            echo 'WeCom rejected the upstream failure notification.' >&2
            exit 1
          fi
          echo 'WeCom accepted the upstream failure notification.'
